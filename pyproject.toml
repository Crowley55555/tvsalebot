[project]
name = "tvsalebot"
version = "0.0.1"
description = "AI-консультант по продаже Samsung TV в Telegram (MVP)"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

# Стек фиксирован architecture/05-стек.md. Добавление новой библиотеки — через П6.
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "aiogram>=3.4,<4.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
  "gigachat>=0.1.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.4,<1.0",
  "mypy>=1.9,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --no-header"
